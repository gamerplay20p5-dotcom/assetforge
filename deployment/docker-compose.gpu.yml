# Caixa SÓ-GPU (ex.: a 203, RTX 4090): roda apenas serviços de inferência. API, banco, Blender, CPU e RAM pesada ficam na 206.
#   docker compose --env-file .env.gpu -f deployment/docker-compose.gpu.yml up -d --build
# Precisa de driver NVIDIA + NVIDIA Container Toolkit no host. A 206 aponta para cá com ASSETFORGE_VLM_URL=http://<ip>:8081,http://vlm:8080
# (GPU primeiro, o container de CPU da 206 como reserva) e ASSETFORGE_VLM_TOKEN igual ao VLM_TOKEN daqui.
name: assetforge-gpu

services:
  vlm-gpu:
    build: { context: .., dockerfile: deployment/Dockerfile.vlm-gpu }
    image: assetforge-vlm-gpu:local
    restart: unless-stopped
    environment:
      VLM_MODEL: ${VLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      VLM_MAX_SIDE: ${VLM_MAX_SIDE:-640}
      VLM_IDLE_UNLOAD_SECONDS: ${VLM_IDLE_UNLOAD_SECONDS:-20}
      VLM_TOKEN: ${VLM_TOKEN:?defina VLM_TOKEN (segredo compartilhado com a API da 206)}
      HF_HUB_OFFLINE: ${VLM_OFFLINE:-1}
    volumes: ["vlm-models:/models"]
    ports: ["${VLM_BIND:-0.0.0.0}:${VLM_PORT:-8081}:8080"]   # só esta porta; exige o token (exceto /health)
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    cpus: ${VLM_GPU_CPUS:-4}                                   # a máquina só fornece GPU: poucos núcleos
    mem_limit: ${VLM_GPU_MEM:-12g}                              # e pouca RAM (os pesos vão direto para a VRAM)
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    tmpfs: ["/tmp:size=1g"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3

volumes:
  vlm-models:
